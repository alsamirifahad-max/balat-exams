/* التخطيط: شريط علوي بهوية الوزارة، تبويبات أفقية، ومحتوى في بطاقات؛ صفحة النماذج: قائمة جانبية + معاينة ورق A4 */
:root{
  --navy:#0b3a46; --navy2:#12505f; --accent:#1f9d66; --accent-ink:#ffffff;
  --bg:#f3f1ec; --surface:#fffdf9; --surface2:#f9f6f0; --ink:#1d2a2f; --muted:#56676c; --line:#e2dbcf; --soft:#efe9de;
  --info:#13707d; --info-bg:#e5f1f0; --info-line:#97cdcc; --shadow:0 1px 2px rgba(12,40,48,.06),0 6px 18px rgba(12,40,48,.05);
  --warn:#b4541a; --bad:#b3193f; --ok:#16794e;
  --ui:'Tajawal',Tahoma,Arial,sans-serif; --doc:'Tajawal','Sakkal Majalla',Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121a1d;--surface:#18242a;--surface2:#1e2d33;--ink:#e7ece9;--muted:#a5b4b2;--line:#2d3f45;--soft:#22353b;--accent:#3cc38f;--info:#8ccbd0;--info-bg:#17333a;--info-line:#3a7179;--shadow:0 1px 2px rgba(0,0,0,.35);--warn:#f0a36b;--bad:#f47c97;--ok:#62d9a2;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121a1d;--surface:#18242a;--surface2:#1e2d33;--ink:#e7ece9;--muted:#a5b4b2;--line:#2d3f45;--soft:#22353b;--accent:#3cc38f;--info:#8ccbd0;--info-bg:#17333a;--info-line:#3a7179;--shadow:0 1px 2px rgba(0,0,0,.35);--warn:#f0a36b;--bad:#f47c97;--ok:#62d9a2;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.vh{position:absolute!important;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);pointer-events:none}
label.btn{cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.55}
[hidden]{display:none!important}
.top{background:var(--navy);color:#fff;position:relative}
.top::before{content:"";display:block;height:6px;background:linear-gradient(90deg,#2b7fc3,#3fb36e)}
.topin{max-width:1500px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top h1{font-size:1.25rem;margin:0;font-weight:700;letter-spacing:0}
.top .sub{color:#b9d6d8;font-size:.85rem}
.top .sp1{flex:1}
.savestate{font-size:.8rem;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.1)}
.savestate{cursor:pointer}.savestate.ok::before{content:"● ";color:#5fe0a0}.savestate.bad::before{content:"● ";color:#ff8fa8}
.savestate.local::before{color:#ffd166}.savestate.warn::before{content:"● ";color:#ffb347}.savestate.busy::before{content:"◌ ";color:#9fd8ff}
.wsw{display:inline-flex;margin-inline-end:10px;background:rgba(255,255,255,.08);border-radius:999px;padding:3px;vertical-align:middle}
.wsw button{font:inherit;font-size:.82rem;font-weight:700;border:0;background:transparent;color:#cfe3ea;padding:6px 14px;border-radius:999px;cursor:pointer}
.wsw button.on{background:#fff;color:var(--navy)}
.syncgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:10px 0}
.synccard{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;background:var(--soft)}
.synccard span{font-size:.85rem;color:var(--muted)}
nav#nav{background:var(--navy2);overflow-x:auto;white-space:nowrap;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.navb{background:none;border:0;color:#d4e6e8;font:inherit;font-weight:600;padding:12px 14px;cursor:pointer;border-bottom:3px solid transparent}
.navb:hover{color:#fff}.navb.on{color:#fff;border-bottom-color:#3fd18c}
.navb:focus-visible,.btn:focus-visible,.chip:focus-visible,.fbtn:focus-visible{outline:2px solid #3fd18c;outline-offset:2px}
main#main{max-width:1500px;margin:0 auto;padding-block:18px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
.card h2{margin:0 0 10px;font-size:1.08rem;color:var(--ink)}
.card.empty{text-align:center;color:var(--muted)}
.hint{color:var(--muted);font-size:.86rem;margin:6px 0}
.warnt{color:var(--warn);font-weight:600}.okt{color:var(--ok);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:10px}
.grid label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);font-weight:500;min-width:0}
.grid .wide{grid-column:1/-1}
.in{font:inherit;font-size:.92rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 9px;min-width:0;width:100%}
.in:focus{outline:2px solid color-mix(in srgb,var(--accent) 50%,transparent);border-color:var(--accent)}
td .in{min-width:6rem}
.in.n2{width:3.6rem;min-width:0}.in.n4{width:5.2rem;min-width:0}
.ta{width:100%;font-family:var(--ui);line-height:1.7;resize:vertical}
.acts{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.inl{display:inline-flex;gap:6px;align-items:center;font-size:.86rem;color:var(--muted);white-space:nowrap;max-width:100%}
.inl .in{width:auto;max-width:100%;min-width:0}
select.in{text-overflow:ellipsis}
.ck{display:inline-flex;gap:6px;align-items:center;font-size:.86rem}
.btn{font:inherit;font-weight:600;font-size:.9rem;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{background:transparent;color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 11px;font-size:.84rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.x{border:0;background:none;color:var(--bad);font-size:1.3rem;line-height:1;cursor:pointer;padding:2px 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:.86rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.chip.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface));font-weight:600}
.chip i{width:26px;height:12px;border-radius:6px;display:inline-block}
.row-label{font-weight:600;font-size:.88rem;margin:14px 0 6px}
.tw{overflow-x:auto;max-width:100%;margin-top:8px}
table.et{border-collapse:collapse;width:100%;font-size:.88rem}
table.et th{background:var(--soft);font-weight:600;text-align:right;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;color:var(--ink)}
table.et th[style]{color:#1b2b2f}
table.et td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:middle;font-variant-numeric:tabular-nums}
table.et.sm td{padding:4px 8px}
table.et td.sum{font-weight:700;text-align:center}
table.et tr.tot td{font-weight:700;background:var(--soft);text-align:center;padding:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin:6px 0 10px}
.stat{border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;border-top:5px solid var(--gc,var(--accent))}
.stat span{font-size:.82rem;color:var(--muted)}.stat b{font-size:1.7rem;font-variant-numeric:tabular-nums;line-height:1.2}.stat small{color:var(--muted);font-size:.78rem}
.day .dayhead{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.dname{font-weight:700;font-size:1.1rem;min-width:4.5rem;color:var(--accent)}
.prevdate{font-size:.82rem;color:var(--muted)}
.dayhead .sp1{flex:1}
.brandprev{display:flex;flex-direction:column;gap:8px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;max-width:900px}
.brandprev img{width:100%;height:auto}
.sub{border-top:1px dashed var(--line);padding-top:10px;margin-top:10px}
.upl{margin:10px 0;padding-inline-start:20px}.upl li.ok{color:var(--ok)}.upl li.bad{color:var(--bad)}

/* خانات الرفع */
.drops{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:12px}
.drops.one{grid-template-columns:1fr}
.drop{display:flex;align-items:center;gap:14px;border:2px dashed var(--line);border-radius:12px;padding:16px;background:var(--soft);transition:border-color .15s,background .15s;min-width:0}
.drop.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.drop.done{border-style:solid;border-color:color-mix(in srgb,var(--ok) 55%,transparent);background:color-mix(in srgb,var(--ok) 7%,var(--surface))}
.dic{flex:none;width:50px;height:50px;border-radius:12px;display:grid;place-items:center;background:var(--navy);color:#fff}
.drop.done .dic{background:var(--ok)}
.dtx{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.dtx b{font-size:1rem}.dtx small{color:var(--muted);font-size:.8rem;line-height:1.5}
.dst{font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}.drop.done .dst{color:var(--ok);font-weight:600}.dst i{font-style:normal;color:var(--muted);font-weight:400}
.upnote{padding:10px 14px;border-radius:9px;margin:12px 0 0;font-weight:600;font-size:.9rem}
.upnote.ok{background:color-mix(in srgb,var(--ok) 12%,var(--surface));color:var(--ok)}
.upnote.bad{background:color-mix(in srgb,var(--bad) 10%,var(--surface));color:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:6px}
.seg button{font:inherit;font-size:.86rem;font-weight:600;border:0;background:var(--surface);color:var(--muted);padding:7px 14px;cursor:pointer}
.seg button.on{background:var(--navy);color:#fff}
td.tnames{font-size:.8rem;color:var(--muted);max-width:22rem}
details summary{cursor:pointer;font-weight:600;color:var(--accent);margin:4px 0}
/* شريط خطوات الإعداد */
.flow{display:flex;align-items:center;flex-wrap:wrap;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.fstep{font:inherit;font-size:.82rem;font-weight:600;display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--muted);padding:4px 8px;border-radius:7px;cursor:pointer}
.fstep i{font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;border:1.5px solid var(--line)}
.fstep.ok{color:var(--ok)}.fstep.ok i{background:var(--ok);border-color:var(--ok);color:#fff}
.fstep.todo i{border-style:dashed}
.fstep.cur{background:var(--soft);color:var(--ink)}
.fstep:hover{background:var(--soft)}
.fsep{width:14px;height:1.5px;background:var(--line)}
@media (max-width:600px){.fsep{display:none}.drop{flex-wrap:wrap;align-items:flex-start;padding:14px;gap:12px}.drop .dic{width:46px;height:46px;flex:0 0 46px}.drop .dtx{flex:1 1 calc(100% - 60px);min-width:0}.drop > label.btn{flex:1 1 100%;padding:10px}}

/* الإسناد والملاحظون */
.tagrp{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:12px}
.tagh{display:flex;justify-content:space-between;align-items:center;gap:8px;border-inline-start:6px solid var(--gc);padding:4px 10px;background:var(--soft);border-radius:6px}
.tagh span{font-size:.8rem;color:var(--muted)}
.tagrp .chip{font-size:.78rem;padding:3px 9px}
.obsl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ob{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);padding:1px 2px}
.ob .in{border:0;width:13rem;min-width:8rem;padding:4px 6px}
.ob .in:focus{outline:none}
.ob.dup{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--surface))}
.ob.busy{border-color:#d98a1f;background:color-mix(in srgb,#d98a1f 10%,var(--surface))}
.ob.sw{outline:3px solid var(--accent);outline-offset:1px}
.ic{border:0;background:none;cursor:pointer;font-size:1rem;color:var(--muted);padding:2px 5px;border-radius:5px}
.ic:hover{background:var(--soft);color:var(--ink)}
.ic.x{color:var(--bad);font-size:1.15rem}
.loadl{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.loadl span{font-size:.8rem;border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.gsprev{background:#fff;color:#000;border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:8px;overflow-x:auto;font-family:var(--doc)}
.gsprev table.t{border-collapse:collapse;width:100%;color:#000}
.gsprev table.t td,.gsprev table.t th{border:1px solid #333;padding:3px 5px;text-align:center;font-size:10pt}
.gsprev img{max-width:100%;height:auto}
.gsprev .note,.gsprev .ds{text-align:center;font-size:9.5pt;margin:4px 0}

/* أشرطة الطباعة السريعة */
.qbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--soft);margin:8px 0}
.qlbl{font-weight:700;font-size:.88rem;min-width:9.5rem}
.impd{margin-top:10px}
/* منتقي الشعب */
.secpick{font:inherit;font-size:.9rem;width:100%;min-height:34px;text-align:right;direction:ltr;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);padding:5px 9px;cursor:pointer}
.secpick:hover{border-color:var(--accent)}
.secpop{position:absolute;z-index:70;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:12px;width:min(320px,calc(100vw - 16px))}
.secgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.secb{display:flex;align-items:center;justify-content:center;border:1.5px solid var(--line);border-radius:8px;padding:8px 0;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.secb input{position:absolute;opacity:0;pointer-events:none}
.secb.on{background:var(--accent);border-color:var(--accent);color:#fff}
/* تجهيز PDF */
.pdfstage{position:fixed;left:-20000px;top:0;background:#fff}
.pdfstage .page{box-shadow:none}
.pdfprog{position:fixed;inset:auto 0 0 0;z-index:80;background:var(--navy);color:#fff;padding:12px max(16px,env(safe-area-inset-left,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.pdfprog .tr{height:6px;background:rgba(255,255,255,.2);border-radius:3px;margin-top:6px;overflow:hidden}
.pdfprog .tr i{display:block;height:100%;width:0;background:#3fd18c;transition:width .2s}

/* نافذة المعاينة */
.pvmodal{position:fixed;inset:0;z-index:65;background:#2b3a3f;display:flex;flex-direction:column}
.pvbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--navy);color:#fff;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(10px + env(safe-area-inset-top,0px))}
.pvt{display:flex;flex-direction:column;flex:1;min-width:12rem}.pvt span{font-size:.8rem;color:#b9d6d8}
.pvz,.pva{display:flex;gap:6px;flex-wrap:wrap}
.pvz .chip{background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}.pvz .chip.on{background:#fff;color:var(--navy)}
.pvbar .btn.ghost{color:#fff;border-color:rgba(255,255,255,.35)}
