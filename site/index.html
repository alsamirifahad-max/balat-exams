function sortStudents(list) {
  const by = S.s.stuSort;
  return list.slice().sort((a, b) => {
    if (by === 'section' && a.sec !== b.sec) return a.sec - b.sec;
    return a.n.localeCompare(b.n, 'ar');
  });
}
function distributeStudents() {
  const tot = stuTotals(), ct = comTotals();
  const bad = G.filter(g => tot[g] !== ct[g]);
  if (bad.length) return { ok: false, msg: 'أعداد اللجان لا تساوي أعداد الطلاب في: ' + bad.map(g => GSHORT[g] + ` (اللجان ${ct[g]} / الطلاب ${tot[g]})`).join('، ') + '. اضغط «توزيع الأعداد تلقائياً» أولاً أو عدّل الأعداد.' };
  G.forEach(g => {
    const list = sortStudents(S.students.filter(x => x.g === g));
    let i = 0, seat = +S.s.seatStart[g] || g * 1000 + 1;
    S.com.forEach(c => { for (let k = 0; k < (+c.c[g] || 0); k++) { const st = list[i++]; st.com = c.no; st.seat = seat++; } });
  });
  S.distributed = true; save(true);

}
function autoCounts() {
  const tot = gradeTotals();
  const caps = S.com.map(c => Math.max(0, +c.cap || comSum(c) || 1));
  const C = caps.reduce((a, b) => a + b, 0) || 1;
  G.forEach(g => {
    const exact = caps.map(cp => tot[g] * cp / C);
    const fl = exact.map(Math.floor); let rem = tot[g] - fl.reduce((a, b) => a + b, 0);
    const order = exact.map((e, i) => [e - Math.floor(e), i]).sort((a, b) => b[0] - a[0]);
    for (let k = 0; k < rem; k++) fl[order[k % order.length][1]]++;
    S.com.forEach((c, i) => c.c[g] = fl[i]);
  });
  S.distributed = false;
  S.students.forEach(x => { x.com = null; x.seat = null; });
}

function autoObservers() {
  const ses = sessions(); const load = {}; S.teachers.forEach(t => load[t] = 0);
  if (!S.teachers.length) return false;
  let rot = 0;
  ses.forEach(se => {
    const busy = new Set(sessionSubjects(se).flatMap(x => teachersOfSubject(x.sub, x.g).concat(teacherOf(x.sub, x.g))).filter(Boolean).map(normName)); if (typeof exSet === 'function') exSet(se.key).forEach(n => busy.add(n));
    const used = new Set();
    S.com.forEach(c => {
      const list = [];
      for (let k = 0; k < obsNeed(c.no); k++) {
        const cand = S.teachers.filter(t => !used.has(t) && !busy.has(normName(t)));
        const pool = cand.length ? cand : S.teachers.filter(t => !used.has(t));
        if (!pool.length) break;
        pool.sort((a, b) => load[a] - load[b] || ((S.teachers.indexOf(a) - rot + 999) % S.teachers.length) - ((S.teachers.indexOf(b) - rot + 999) % S.teachers.length));
        const t = pool[0]; used.add(t); load[t]++; list.push(t);
      }
      S.obs[`${se.key}_${c.no}`] = list;
    });
    if (typeof resNeed === 'function') { const rp = S.teachers.filter(t => !used.has(t) && !busy.has(normName(t))).sort((a, b) => load[a] - load[b] || AR.compare(normName(a), normName(b))); S.obs[`${se.key}_R`] = rp.slice(0, resNeed()); }
    rot = (rot + 7) % S.teachers.length;
  });
  return true;
}

/* قراءة ملف (صورة / PDF / Word / Excel) إلى صور ونص */
async function readDocFile(file) {

  if (isImg) imgs.push(await imgToJpeg(await asUrl(buf, file.type || 'image/jpeg'), 1600));
  else if (buf[0] === 0x25 && buf[1] === 0x50) {
    await ensurePdfJs(); const pdf = await pdfjsLib.getDocument({ data: buf.slice(), isEvalSupported: false }).promise;
    for (let i = 1; i <= Math.min(4, pdf.numPages); i++) {
      const pg = await pdf.getPage(i); const vp0 = pg.getViewport({ scale: 1 }); const vp = pg.getViewport({ scale: 1600 / vp0.width });
      const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height; const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);

      try { txt += ' ' + (await pg.getTextContent()).items.map(t => t.str).join(' '); } catch (e) { }
    }

    const media = z.FullPaths.map((p, i) => ({ p, f: z.FileIndex[i] })).filter(x => /word\/media\/.+\.(png|jpe?g|gif|bmp|webp)$/i.test(x.p) && x.f.content && x.f.content.length > 8000);
    for (const m of media.slice(0, 4)) { const ext = m.p.split('.').pop().toLowerCase(); imgs.push(await imgToJpeg(await asUrl(m.f.content, 'image/' + (ext === 'jpg' ? 'jpeg' : ext)), 1600)); }
    try { txt = docxRows(buf).map(r => r.join(' ')).join('\n'); } catch (e) { }
    if (!imgs.length && txt) html = txt.split('\n').map(l => `<p style="margin:2px 0">${esc(l)}</p>`).join('');
  } else if (/\.(xlsx|xls|csv)$/i.test(file.name)) {
    const wb = XLSX.read(buf, { type: 'array' }); const sh = wb.Sheets[wb.SheetNames[0]];

    txt = rows.map(r => r.join(' ')).join('\n');
    html = `<table class="et dense"><tbody>${rows.slice(0, 80).map(r => `<tr>${r.map(c => `<td>${esc(String(c))}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  } else throw new Error('صيغة غير مدعومة — ارفع صورة أو PDF أو Word أو Excel');
  return { imgs, txt, html };
}

/* استخراج التواريخ من نص التقويم (هجري أو ميلادي) */

","m": [{"n": "عبدالله بن سعد الغامدي","w": "","r": "رئيساً","k": "متابعة"},{"n": "عبدالهادي بن نايف السلمي","w": "","r": "عضواً","k": "استلام وتسليم"},{"n": "فايز بن أحمد عقباوي","w": "","r": "عضواً","k": "استلام وتسليم"},{"n": "يحيى بن عبدالله المالكي","w": "","r": "عضواً","k": "استلام وتسليم"},{"n": "أحمد بن محمد حلواني","w": "","r": "عضواً","k": "استلام وتسليم"},{"n": "مبارك بن ظافر الأسمري","w": "","r": "عضواً","k": "مساندة ورصد"}],"d": ["تحديد عدد الطلاب في كل لجنة، وتحديد مقارها.","طباعة قوائم بأسماء الطلاب لكل لجنة من نظام نور.","تزويد كل لجنة بجداول الاختبارات، وكشوف بأسماء الطلاب، وأرقام جلوسهم.","استلام أوراق إجابات الطلاب من الملاحظين.","تسليم مظروف أوراق الإجابة لرئيس لجنة التصحيح والمراجعة.","تزويد مكتب التعليم بصورة من أسئلة الاختبار، وصورة من الإجابة النموذجية، بعد نهاية الاختبارات.","حفظ كشوف الرصد النهائية مكتملة التوقيعات من الراصد والمملي والمراجع في الملفات الخاصة بذلك.","استلام أوراق الاجابة بعد الانتهاء من الرصد والمطابقة من لجنة التصحيح والمراجعة.","حفظ أوراق الإجابة في الخزانة المخصصة لذلك.","القيام بأي مهام أخرى يتم التكليف بها في مجال اختصاصها."],"pre": "إن مدير المدرسة، وبناءً على الصلاحيات الممنوحة له، وبناءً على ما تقتضيه المصلحة العامة، يقرر تشكيل لجنة التحكم والضبط على النحو التالي:"},{"id": "superv","t": "لجنة الإشراف والملاحظة","c": "#c2410c","m": [{"n": "ظافر بن سعيد العمري","w": "وكيل شؤون الطلاب","r": "رئيساً","k": "توجيه ومتابعة سير العمل"},{"n": "سلطان بن عبدالمنعم السلمي","w": "وكيل الشؤون التعليمية","r": "عضواً","k": "توجيه ومتابعة سير العمل"},{"n": "مازن بن عودة الأحمدي","w": "معلم","r": "عضواً","k": "مساعد مشرف لجان الدور الأول"},{"n": "عادل بن علي الغامدي","w": "معلم","r": "عضواً","k": "مساعد مشرف لجان الدور الأول"},{"n": "الحسين بن محمد القاضي","w": "إداري","r": "عضواً","k": "متابعة غياب طلاب الدور الأول"},{"n": "سالم بن محمد الشهراني","w": "موجه","r": "عضواً","k": "متابعة غياب طلاب الدور الأول والثالث"},{"n": "ظافر بن سعيد العمري","w": "وكيل شؤون الطلاب","r": "عضواً","k": "مشرف لجان الدور الثاني"},{"n": "مسعد بن عوض السلمي","w": "إداري","r": "عضواً","k": "مساعد مشرف ومتابعة غياب الدور الثاني"},{"n": "عبدالعزيز بن حمود الغامدي","w": "موجه","r": "عضواً","k": "متابعة غياب لجان الدور الثاني"},{"n": "سليمان بن وزن الشهري","w": "محضر حاسب","r": "عضواً","k": "مشرف لجان الدور الثالث"},{"n": "فواز بن وصل الله السلمي","w": "محضر مختبر","r": "عضواً","k": "مساعد مشرف الدور الثالث"},{"n": "نايف بن عبدالله المالكي","w": "إداري","r": "عضواً","k": "مساعد مشرف الدور الثالث"},{"n": "حسن بن مخضور البشري","w": "معلم","r": "عضواً","k": "مشرف لجان الصالة"},{"n": "صالح بن عبدالله الأزهري","w": "معلم","r": "عضواً","k": "مساعد مشرف لجان الصالة"},{"n": "كامل بن حسن القرني","w": "موجه","r": "عضواً","k": "متابعة غياب لجان الصالة"},{"n": "عبدالعزيز بن جمعان الزهراني","w": "رائد النشاط","r": "عضواً","k": "مساعد مشرف لجان الصالة"},{"n": "مبارك بن ظافر الأسمري","w": "معلم","r": "عضواً","k": "مراقب الدور الأرضي"},{"n": "ماجد بن عبده هجام","w": "إداري","r": "عضواً","k": "مراقب الدور الأرضي"}],"d": ["إعداد الجداول الخاصة بالملاحظين، والإشراف اليومي.","متابعة توقيع الملاحظين على نموذج سجل الملاحظين اليومي.","تحديد الملاحظ البديل عند تأخر أو غياب أحد الملاحظين قبل بدء الاختبار وفق النموذج.","التأكد من سلامة مظاريف الأسئلة ونماذج الإجابة.","تُفتح مظاريف الأسئلة قبل بدء الاختبار بـ (15) دقيقة.","متابعة دخول الطلاب للجان الاختبار.","تسليم مظاريف أسئلة الطلاب للمشرفين على قاعات الاختبار.","إعداد محضر رسمي عند الإخلال بسرية الأسئلة، وسير الاختبارات وفق النماذج.","متابعة سير الاختبارات، وحضور الطلاب، وخروجهم أثناء الاختبارات.","استلام الأسئلة من المشرفين على قاعات الاختبار قبل بدء الاختبار بـ (5) دقائق، وتوزيع الأسئلة على الطلاب في بداية وقت الاختبار.","تطبيق ضوابط التصحيح الآلي في أعمال الاختبارات (للمدارس التي تطبق التصحيح الآلي) المنظم لذلك.","متابعة غياب الطلاب في أثناء الاختبارات، وحصرهم وفق النماذج والاتصال على الطلاب الغائبين مع مراعاة الوقت المحدد لوقت الاختبار.","التعامل مع الطلاب المتأخرين عن الاختبار حسب زمن حضورهم وفق النماذج.","متابعة أداء الملاحظين داخل لجان الاختبار والقيام بأي مهام أخرى يتم التكليف بها في مجال اختصاصها.","توزيع كشوف تسليم أوراق الإجابة (كشوف المناداة) لملاحظي اللجان بعد انقضاء نصف زمن الاختبار."],"pre": "إن مدير المدرسة، وبناءً على الصلاحيات الممنوحة له، وبناءً على ما تقتضيه المصلحة العامة، يقرر تشكيل لجنة الإشراف والملاحظة على النحو التالي:"},{"id": "correct","t": "لجنة التصحيح الآلي والمراجعة","c": "#be185d","m": [{"n": "سلطان بن عبدالمنعم السلمي","w": "","r": "رئيساً","k": "متابعة سير العمل"},{"n": "فايز بن أحمد عقباوي","w": "","r": "عضواً","k": "التصحيح الآلي"},{"n": "عبدالهادي بن نايف السلمي","w": "","r": "عضواً","k": "التصحيح الآلي"},{"n": "يحيى بن عبدالله المالكي","w": "","r": "عضواً","k": "التصحيح الآلي"},{"n": "مبارك بن ظافر الأسمري","w": "","r": "عضواً","k": "مساندة ورصد"}],"d": ["استلام رئيس لجنة التصحيح والمراجعة أوراق إجابات الطلاب ونماذج الإجابة من لجنة التحكم والضبط وتسليمها للجان التصحيح وفقا للتخصص.","تحديد أسماء وتواقيع المصححين والمراجعين لكل مادة على حدة وفق النموذج.","في حالة اكتشاف خطأ في الأسئلة، أو في الإجابة النموذجية يتم إعداد محضر بذلك مضمنا الاجراء المتخذ.","تدقيق عملية التصحيح، وتدقيق عملية الرصد وفق النموذج.","مطابقة درجات الكشف المستخرج من نظام نور مع درجات أوراق الإجابة.","المصادقة والتوقيع على كشوف الرصد المستخرجة من نظام نور.","تسليم أوراق الإجابة بعد الانتهاء من الرصد والمطابقة للجنة التحكم والضبط مع كشوف الرصد.","تطبيق ضوابط التصحيح الآلي في أعمال الاختبارات (للمدارس التي تطبق التصحيح الآلي) المنظم لذلك.","القيام بأي مهام أخرى يتم التكليف بها في مجال اختصاصها."],"pre": "إن مدير المدرسة، وبناءً على الصلاحيات الممنوحة له، وبناءً على ما تقتضيه المصلحة العامة، يقرر تشكيل لجنة التصحيح الآلي والمراجعة على النحو التالي:"},{"id": "grades","t": "لجنة الرصد وإخراج النتائج","c": "#4338ca","m": [{"n": "سلطان بن عبدالمنعم السلمي","w": "","r": "رئيساً","k": "المتابعة لسير العمليات"},{"n": "مبارك بن ظافر الأسمري","w": "","r": "عضواً","k": "متابعة رصد الدرجات"},{"n": "فايز بن أحمد عقباوي","w": "","r": "عضواً","k": "التصحيح الآلي"},{"n": "معلم كل مادة دراسية","w": "","r": "عضواً","k": "رصد الدرجات في نظام نور"}],"d": ["التأكد من رصد جميع الدرجات المستحقة للطلاب في نظام نور (درجات أعمال السنة للفصلين، درجات مواد التقويم المستمر، والدرجات المخصصة للجانب العملي أو الشفوي في المواد التي بها اختبار عملي أو شفوي) وذلك قبل الاختبار.","تطبيق ضوابط التصحيح الآلي في أعمال الاختبارات (للمدارس التي تطبق التصحيح الآلي) المنظم لذلك.","يرصد المعلم درجات مادته في نظام نور من أوراق إجابات الطلاب مباشرة، ويراجعها بنفسه، ثم يُطبع كشفٌ أولي يُرفق مع ورقة الإجابة، ثم يسلم إلى لجنة التصحيح والمراجعة، لمطابقة وتدقيق الدرجات وصحة الإدخال بمشاركة معلم المادة، والتوقيع على ذلك، وفي حال وجود اختلاف يتم التعديل وطباعة الكشف والتوقيع عليه مرة أخرى مع ابقاء الكشف السابق.","طباعة كشف رصد درجات كل مادة من نظام نور بعد رصد جميع درجات أعمال السنة واختبار نهاية الفصل (أيقونة الاختبارات ← الدرجات ← إدخال الدرجات ← طباعة)، ويُدوَّن أسفل كل صفحة: رصده / أملاه / راجعه مع التوقيع.","استخراج النتيجة الأولية من نظام نور.","المراجعة النهائية للطلاب المستحقين للمراجعة النهائية، وفق ما ورد في الفصل العاشر من دليل نظم وإجراءات الاختبارات.","استخراج النتيجة النهائية، وطباعة الشهادات وحفظها في ملفات الطلاب بعد اعتمادها، وعلى الحاسب الآلي بتنسيق (pdf) وفي وحدة تخزين خارجية.","إدخال جدول الدور الثاني في نظام نور.","التأكيد على أولياء الأمور والطلاب بالاستعلام عن النتائج من نظام نور.","تسليم الطالب المكمل أصل الاشعار الرسمي بمواد إكماله، ويُوقع بالاستلام على صورة الاشعار، وتحفظ في ملفه للرجوع إليها عند الحاجة.","تزويد لجنة الاختبارات ببيان أسماء المكملين، ومواد إكمالهم من نظام نور.","تكون مراجعة أوراق الإجابة بعد إعلان النتائج لمن يرغب وفقاً لما ورد في الفصل الثالث عشر من دليل نظم وإجراءات الاختبارات.","طباعة مبيضة النتائج وتغليفها، والاحتفاظ بها في خزانة المدرسة وعلى الحاسب الآلي بتنسيق (pdf) وفي وحدة تخزين خارجية.","القيام بأي مهام أخرى يتم التكليف بها في مجال اختصاصها."],"pre": "إن مدير المدرسة، وبناءً على الصلاحيات الممنوحة له، وبناءً على ما تقتضيه المصلحة العامة، يقرر تشكيل لجنة الرصد وإخراج النتائج على النحو التالي:"},{"id": "audit","t": "لجنة التدقيق والمطابقة","c": "#0f766e","m": [{"n": "مبارك بن ظافر الأسمري","w": "","r": "رئيساً","k": قيام أي عضو من اللجنة بأي أعمال تسند إليه."],"pre": "إن مدير المدرسة، وبناءً على الصلاحيات الممنوحة له، وبناءً على ما تقتضيه المصلحة العامة، يقرر تشكيل لجنة الاستقبال والتوديع على النحو التالي:"},{"id": "kontrol","t": "لجنة الكنترول","c": "#2563eb","m": [{"n": "موسى بن صالح خواجي","w": "","r": "رئيساً","k": "متابعة وإشراف"},{"n": "محمد بن عبدالله الشهري","w": "","r": "نائباً للرئيس","k": "متابعة"},{"n": "علي بن قبلان القرني","w": "","r": "عضواً","k": "متابعة"},{"n": "سلمان بن عبدالله المحمدي","w": "","r": "عضواً","k": "متابعة"},{"n": "عبدالرحمن بن جمعان الزهراني","w": "","r": "عضواً","k": "متابعة"},{"n": "راضي بن عازب الحارثي","w": "","r": "عضواً","k": "متابعة"}],"d": ["فتح مظاريف الأسئلة من قبل اللجنة المكلفة بذلك.","ضرورة مطابقة المعلومات المكتوبة على المظروف مع جدول سير الاختبارات لكل مرحلة (المادة، الفترة، اليوم، التاريخ).","حفظ نماذج من الأسئلة و الإجابة ووضعها في الملفات الخاصة لها.","حفظ ظروف الأسئلة الزائدة بعد اخذ النماذج منها في المكان المخصص لذلك.","قيام أي عضو من اللجنة بأي أعمال تسند إليه.","تسليم واستلام اسئلة الاختبار.","إعداد أوراق الإجابة في جميع فترات الاختبار.","تسليم كشوف الاستلام في مواعيدها المحددة (بعد مرور نصف الزمن المحدد للإجابة).","استلام أوراق الإجابة بعد الاختبار من الملاحظين بالعدد والتأكد منها بإثباتها في السجل المعد لذلك.","تسليم أوراق الإجابة للجان التصحيح وكتابة اسم المستلم وتوقيعه.","استلام الأوراق بعد تصحيحها و التأكد من عددها والتوقيع على الاستلام.","المشاركة بما يستجد من أعمال تكلف بها اللجنة."],"pre": "إن مدير المدرسة، وبناءً على الصلاحيات الممنوحة له، وبناءً على ما تقتضيه المصلحة العامة، يقرر تشكيل لجنة الكنترول على النحو التالي:"},{"id": "reserve","t": "لجنة الاحتياط","c": "#475569","m": [],"d": ["دخول اللجان في حالة تأخر او تغيب الملاحظ.","تفتيش الطلاب عند المداخل الرئيسية.","الحضور المبكر قبل الساعة (7) ص وعدم المغادرة حتى انتهاء اللجان.","قيام أي عضو من اللجنة بأي أعمال تسند إليه.","المساندة في ادخال الطلاب للجان.","المساندة في الضبط العام."],"note": "تتكون هذه اللجنة من معلمي الاحتياط اليومي، ويحددهم وكيل الشؤون التعليمية /* ===================== خطة الاختبارات: اللجان العاملة وتوزيع الأدوار ===================== */
let PLAN_VIEW = 'c', PLAN_OPEN = {}, PLAN_REP = null, PLAN_Q = '';
const PLAN_ROLES = ['رئيساً', 'نائباً للرئيس', 'عضواً', 'مقرراً'];
const PLAN_COLS = ['#0e7490', '#7c3aed', '#c2410c', '#be185d', '#4338ca', '#0f766e', '#b45309', '#2563eb', '#475569'];
function planGet() { return S.s.plan && Array.isArray(S.s.plan.coms) ? S.s.plan : PLAN_DEF; }
function planEdit() { if (!S.s.plan || !Array.isArray(S.s.plan.coms)) S.s.plan = clone(PLAN_DEF); return S.s.plan; }
function planTouched() { return !!(S.s.plan && Array.isArray(S.s.plan.coms)); }
function planHead(c) { const h = c.m.find(x => /رئيس/.test(x.r || '') && !/نائب/.test(x.r || '')); return h ? h.n : ''; }
function planPeople() {
  const m = new Map();
  planGet().coms.forEach(c => c.m.forEach(x => { const n = (x.n || '').trim(); if (!n) return; if (!m.has(n)) m.set(n, []); m.get(n).push({ c, x }); }));
  return [...m.entries()].map(([n, l]) => ({ n, l })).sort((a, b) => b.l.length - a.l.length || a.n.localeCompare(b.n, 'ar'));
}
function planStats() { const P = planGet(), ppl = planPeople(); return { coms: P.coms.length, seats: P.coms.reduce((a, c) => a + c.m.length, 0), ppl: ppl.length, empty: P.coms.reduce((a, c) => a + c.m.filter(x => !(x.n || '').trim()).length, 0), noHead: P.coms.filter(c => c.m.length && !planHead(c)).length, max: ppl[0] ? ppl[0].l.length : 0 }; }
function planRO() { if (typeof exReadOnly === 'function' && exReadOnly()) { toast('هذا الجهاز للاطلاع فقط على بيانات الاختبارات', true); return true; } return false; }

function planComCard(c, i) {
  const open = !!PLAN_OPEN[c.id], head = planHead(c), anyW = c.m.some(x => x.w), anyK = c.m.some(x => x.k);
  const roleSel = (x, j) => { const list = PLAN_ROLES.includes(x.r) || !x.r ? PLAN_ROLES : [x.r, ...PLAN_ROLES]; return `<select class="in" data-pk="coms.${i}.m.${j}.r" aria-label="الصفة">${list.map(r => `<option${r === (x.r || 'عضواً') ? ' selected' : ''}>${esc(r)}</option>`).join('')}</select>`; };
  const rows = c.m.map((x, j) => `<div class="plm${/رئيس/.test(x.r || '') && !/نائب/.test(x.r || '') ? ' hd' : ''}">
      <b class="pli">${j + 1}</b>
      <input class="in pn" data-pk="coms.${i}.m.${j}.n" value="${esc(x.n || '')}" list="tlist" placeholder="اسم العضو" aria-label="الاسم">
      ${roleSel(x, j)}
      <input class="in pw" data-pk="coms.${i}.m.${j}.w" value="${esc(x.w || '')}" list="plwork" placeholder="العمل (معلم، موجه…)" aria-label="العمل">
      <input class="in pk" data-pk="coms.${i}.m.${j}.k" value="${esc(x.k || '')}" placeholder="المهمة داخل اللجنة" aria-label="المهمة">
      <span class="pla"><button type="button" class="pmv" data-pact="mUp" data-c="${i}" data-j="${j}" title="تقديم"${j ? '' : ' disabled'}>▲</button><button type="button" class="pmv" data-pact="mDn" data-c="${i}" data-j="${j}" title="تأخير"${j < c.m.length - 1 ? '' : ' disabled'}>▼</button><button type="button" class="x" data-pact="mDel" data-c="${i}" data-j="${j}" title="حذف العضو">×</button></span>
    </div>`).join('');
  return `<details class="plcom" style="--pc:${c.c || PLAN_COLS[i % PLAN_COLS.length]}" data-pid="${esc(c.id)}"${open ? ' open' : ''}>
    <summary><i class="pldot"></i><span class="plt"><b>${esc(c.t)}</b><small>${head ? 'الرئيس: ' + esc(head) : (c.m.length ? '<em class="warnt">بلا رئيس</em>' : esc(c.note ? 'تُحدَّد يومياً' : 'لا أعضاء بعد'))}</small></span><span class="plcnt">${c.m.length}<small>عضو</small></span><span class="plchev" aria-hidden="true">‹</span></summary>
    ${open ? `<div class="plb">
      ${qbar('planCom', 'قرار التشكيل:', '', { pc: c.id })}
      <div class="plmh${anyW || anyK ? '' : ' slim'}"><span>م</span><span>الاسم</span><span>الصفة</span><span>العمل</span><span>المهمة</span><span></span></div>
      <div class="plms">${rows || '<p class="mut plnone">لا يوجد أعضاء — أضف أول عضو.</p>'}</div>
      <div class="acts wrap"><button type="button" class="btn sm pri" data-pact="mAdd" data-c="${i}">＋ إضافة عضو</button></div>
      <details class="pladv"><summary>مهام اللجنة (${c.d.length}) ونص القرار</summary>
        <label class="plf">اسم اللجنة<input class="in" data-pk="coms.${i}.t" value="${esc(c.t)}"></label>
        <label class="plf">نص القرار (الديباجة)<textarea class="in" rows="3" data-pk="coms.${i}.pre">${esc(c.pre || '')}</textarea></label>
        <label class="plf">المهام — كل مهمة في سطر<textarea class="in" rows="${Math.min(14, Math.max(5, c.d.length + 1))}" data-pd="${i}">${esc(c.d.join('\n'))}</textarea></label>
        <div class="acts wrap"><button type="button" class="btn sm danger" data-pact="cDel" data-c="${i}">حذف هذه اللجنة</button></div>
      </details></div>` : ''}
  </details>`;
}
function planPeopleView() {
  const q = normName(PLAN_Q), ppl = planPeople().filter(p => !q || normName(p.n).includes(q));
  return `<input class="in plq" type="search" placeholder="🔎 ابحث عن اسم…" value="${esc(PLAN_Q)}" oninput="PLAN_Q=this.value;planPplRender()">
  <div id="plPpl" class="plppl">${planPplRows(ppl)}</div>`;
}
function planPplRows(ppl) {
  if (!ppl.length) return '<p class="mut">لا يوجد اسم مطابق.</p>';
  return ppl.map(p => `<div class="plp${p.l.length >= 4 ? ' hv' : ''}">
    <div class="plpn"><b>${esc(p.n)}</b><span class="plload" title="عدد التكليفات">${p.l.length}</span>
      ${PLAN_REP === p.n ? `<span class="plrep"><input class="in" id="plRepIn" list="tlist" placeholder="اسم البديل"><button type="button" class="btn sm pri" data-pact="repGo" data-n="${esc(p.n)}">إحلال</button><button type="button" class="btn sm ghost" data-pact="repX">إلغاء</button></span>` : `<button type="button" class="btn sm ghost plrb" data-pact="rep" data-n="${esc(p.n)}">🔁 إحلال في كل اللجان</button>`}</div>
    <div class="plch">${p.l.map(({ c, x }) => `<button type="button" class="plchip" style="--pc:${c.c || '#475569'}" data-pact="goCom" data-id="${esc(c.id)}"><b>${esc(c.t.replace(/^لجنة\s+/, ''))}</b><span>${esc(x.r || 'عضواً')}${x.k ? ' · ' + esc(x.k) : ''}</span></button>`).join('')}</div>
  </div>`).join('');
}

var PLAN_PROC = [{"id": "flow", "t": "خطة سير ورقة الإجابة", "i": ["يستلم الملاحظ أوراق الأسئلة والإجابة من مشرف الدور قبل بدء الاختبار، ويوزعها على الطلاب في بداية الوقت.", "بعد انقضاء نصف الزمن تُوزَّع كشوف المناداة وتسليم أوراق الإجابة على ملاحظي اللجان.", "يجمع الملاحظ أوراق الإجابة ويعدّها ويطابقها مع كشف المناداة، ويوقّع الطالب عند اسمه.", "تُسلَّم الأوراق إلى لجنة الكنترول بالعدد، وتُثبت في سجل الاستلام بتوقيع المستلم.", "تسلّم لجنة التحكم والضبط مظروف أوراق الإجابة لرئيس لجنة التصحيح والمراجعة بموجب محضر.", "تُصحَّح الأوراق وتُراجَع وفق التخصص، ثم ترصد الدرجات في نظام نور ويُطبع كشف أولي يُرفق مع الأوراق.", "تطابق لجنة التدقيق والمطابقة الدرجات المرصودة مع ورقة الإجابة، ويوقّع الراصد والمملي والمراجع.", "تُعاد الأوراق بعد الرصد والمطابقة إلى لجنة التحكم والضبط وتُحفظ في الخزانة المخصصة."]}, {"id": "results", "t": "استخراج النتائج وتحليلها", "i": ["التأكد التام من استيفاء رصد درجات أعمال السنة ومطابقتها لسجلات المعلمين في جميع المواد.", "التأكد التام من رصد درجات جميع المواد لجميع الطلاب.", "طباعة إشعار الطلاب بدرجات الفصل الدراسي وتسليمه لرواد الفصول لتوزيعه بعد مراجعته وتوقيعه.", "طباعة كشوف الدرجات وتغليفها وكتابة نتيجة الفصل الدراسي والعام على غلافها.", "طباعة إحصائيات نتائج الفصل الدراسي.", "تحليل النتائج لمعرفة المقصرين من الطلاب ومناقشة الأسباب مع المعلمين، وتحديد خطة علاجية بمشاركة الموجه الطلابي.", "إجراء المراجعات النهائية للمواد المستحقة وتسجيلها في بيان خاص، وتوضيح الزيادة على ورقة الإجابة باللون الأخضر، وتسجيل الدرجة قبل المراجعة وبعدها.", "رصد الدرجات بعد الانتهاء من المراجعات النهائية.", "طباعة كشوف الناجحين والأوائل لكل صف، وكشوف المكملين ومواد إكمالهم.", "طباعة إشعارات الناجحين والمكملين (المواد وموعد اختبار الدور الثاني) وتسليمها للطلاب مع التوقيع بالاستلام.", "طباعة مبيضات النتيجة النهائية للدور الأول وإحصائياتها.", "في الدور الثاني: احتساب النتيجة النهائية بعد رصد درجات المكملين والمراجعة النهائية، وطباعة بيان الناجحين والراسبين وكشوف الدرجات وإرفاقها بنتيجة الدور الأول.", "طباعة إشعارات وشهادات الناجحين في الدور الثاني وحفظها في ملفاتهم."]}, {"id": "analysis", "t": "تحليل النتائج — الغايات", "i": ["معرفة المستوى الفعلي للعملية التربوية والتعليمية في المدرسة.", "معرفة الإيجابيات والسلبيات من خلال تحليل نتائج الاختبارات الفصلية.", "قياس مستوى الاختبار ومراعاته للجوانب التربوية والتعليمية المطلوبة في تقويم تحصيل الطالب.", "الوقوف على الجهود المبذولة من أسرة المدرسة (معلمين وطلاب وإداريين) ومدى تحقيقها للأهداف.", "التعرف على جميع المتغيرات المؤثرة على نتيجة المدرسة.", "رفع المستوى التحصيلي للطلاب وتحديد المتأخرين لمعالجة تأخرهم من خلال لجنة يكون الموجه الطلابي عضواً فيها."]}, {"id": "cheat", "t": "أحكام الغش", "rows": [["صفوف النقل — المرة الأولى في اختبار نهاية أحد الفصلين أو الدور الثاني", ["يُحرَّر محضر يعتمده مدير المدرسة مع إرفاق وسيلة الغش ما أمكن.", "تُلغى درجة السؤال أو الأسئلة التي ثبت الغش فيها ويُعطى صفراً.", "يؤخذ على الطالب تعهد خطي بعدم التكرار."]], ["صفوف النقل — المرة الثانية", ["يُحرَّر محضر يعتمده مدير المدرسة مع إرفاق وسيلة الغش ما أمكن.", "يُلغى اختباره في المادة ويُعدّ مكملاً مع الاحتفاظ بدرجات أعمال السنة، وإن كان في الدور الثاني يُعدّ راسباً ذلك العام.", "تُدوَّن كلمة (غاش) في حقل درجة الاختبار في كشوف النتائج."]], ["صفوف النقل — المرة الثالثة", ["يُحرَّر محضر يعتمده مدير المدرسة مع إرفاق وسيلة الغش ما أمكن.", "يُحرم الطالب من دخول اختبار بقية المواد بعد موافقة مركز الإشراف.", "تُدوَّن ملاحظة: حُرم من دخول اختبار بقية المواد بسبب تكرار الغش."]], ["الثالث الثانوي — الفصل الأول", ["يُطبَّق ما ورد في قاعدة صفوف النقل."]], ["الثالث الثانوي (الدور الأول أو الثاني) — المرة الأولى", ["يُحرَّر محضر يعتمده مدير المدرسة مع إرفاق وسيلة الغش ما أمكن.", "يؤخذ تعهد خطي على الطالب بعدم التكرار.", "يُرسل المحضر إلى مركز الاختبارات مع وسيلة الغش إن وُجدت.", "تُلغى درجة السؤال أو الأسئلة التي ثبت الغش فيها."]], ["الثالث الثانوي — المرة الثانية", ["يُحرَّر محضر ويُرسل إلى مركز الاختبارات مع وسيلة الغش.", "يُلغى اختباره في المادة ويُعدّ مكملاً مع الاحتفاظ بدرجة أعمال السنة، وإن كان في الدور الثاني يُعدّ راسباً ذلك العام.", "تُدوَّن كلمة (غاش) في حقل درجة الاختبار."]], ["الغش الجماعي — صفوف النقل", ["حصر الأوراق المشتبه فيها.", "يُحرَّر محضر من اللجنة المختصة بشهود الحالة يعتمده مدير المدرسة مع التحفظ على النتيجة.", "يُرفع المحضر إلى مركز الإشراف للتحقيق العاجل والبت."]], ["الغش الجماعي — الثالث الثانوي", ["حصر الأوراق المشتبه فيها.", "يُحرَّر محضر يعتمده مدير المدرسة ويُرفع لمركز الاختبارات لحجز النتيجة.", "يتحفظ مركز الاختبارات على النتيجة ويرفعها للإدارة العامة للاختبارات والقبول للبت."]]]}, {"id": "absence", "t": "أحكام الغياب والأعذار المقبولة", "i": ["الغائب بعذر مقبول عن اختبار الفصل الأول يُختبر خلال الأسبوعين الأولين من بداية الفصل الثاني.", "الغائب بعذر مقبول عن اختبار الفصل الثاني (الدور الأول) حتى الثاني الثانوي يُختبر في موعد لا يتجاوز أسبوعاً من نهاية الاختبار.", "لا يُسمح لطالب الثالث الثانوي الغائب عن اختبار الفصل الثاني (الدور الأول) بالاختبار مع المتغيبين بعذر، وعليه التقدم لاختبار الدور الثاني.", "الغائب بعذر مقبول عن الدور الثاني يُختبر في موعد لا يتجاوز الأسبوعين الأولين من بداية الفصل الأول.", "الأعذار المقبولة: مرض يثبت بتقارير طبية — التوقيف من الجهات الأمنية بتقارير رسمية — تمثيل المملكة في المحافل الرياضية والثقافية بخطاب رسمي — وفاة قريب من الدرجة الأولى — مرافقة قريب من الدرجة الأولى منوَّم بتقارير طبية معتمدة.", "الطالب الذي درس الفصل الأول خارج المملكة ولا تتوافق مواده أو لا يمكن معادلة درجاته يجوز له الاختبار مع المتغيبين بعذر.", "الحالات التي لم يرد ذكرها تُقدّرها المدرسة بالتنسيق مع إدارة التعليم."]}, {"id": "keep", "t": "حفظ أوراق الإجابة بعد الاختبارات", "i": ["تبقى أوراق إجابات الطلاب (عدا الثالث الثانوي) محفوظة لدى المدرسة حتى قرب موعد اختبار الفصل الأول للعام التالي، ثم يُتخلص منها بمحضر.", "تُحفظ أوراق الثالث الثانوي في مراكز الاختبارات ويُتخلص منها قبل بداية اختبار الفصل الثاني للعام التالي.", "يُتخلص من الأوراق المساندة (تحقيق الشخصية، الحضور والغياب، محاضر الغش، الإحصاء اليومي…) بعد مضي عامين دراسيين."]}, {"id": "review", "t": "قواعد المراجعة النهائية", "i": ["بعد رصد الدرجات تُطبع كشوف النتيجة كمسودة، ويُنظر في كشوف المكملين لتحديد المستحقين للمراجعة النهائية.", "يُعاد النظر في ورقة الطالب الذي لم ينجح في مادة واحدة مهما كانت درجته ولو صفراً.", "يُعاد النظر في ورقتي الطالب الذي لم ينجح في مادتين بشرط ألا تقل درجة كل منهما عن النهاية الصغرى بأكثر من أربع درجات.", "لا يجوز إخراج أوراق الطالب للمراجعة النهائية في أكثر من مادتين.", "تُطبَّق المراجعة النهائية على اختبار الفصل الثاني والدور الثاني، وعلى الفصل الأول إذا أدت إلى نجاح الطالب، ولجميع الطلاب.", "الهدف حصول الطالب على ما يستحقه فعلاً من درجات، لا النجاح بغير وجه حق.", "يكتب المراجع على الورقة وكشف المراجعة إحدى العبارات: روجعت وزيدت … درجة / روجعت ونقصت … درجة / روجعت ولم تقبل الزيادة — بالقلم الأخضر.", "لا يراجع إلا معلم متخصص في المادة أو قريب منها، وتُعاد الأوراق والكشوف بعد التوقيع إلى ملف المادة ثم تُسلَّم لرئيس اللجنة بتوقيع."]}];

    if (b && J(l) !== J(b)) { rows.push(l); n++; } else rows.push(r); });
