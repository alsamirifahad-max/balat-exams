/* التخطيط: شريط علوي بهوية الوزارة، تبويبات أفقية، ومحتوى في بطاقات؛ صفحة النماذج: قائمة جانبية + معاينة ورق A4 */
:root{
  --navy:#0b3a46; --navy2:#12505f; --accent:#1f9d66; --accent-ink:#ffffff;
  --bg:#f3f1ec; --surface:#fffdf9; --surface2:#f9f6f0; --ink:#1d2a2f; --muted:#56676c; --line:#e2dbcf; --soft:#efe9de;
  --info:#13707d; --info-bg:#e5f1f0; --info-line:#97cdcc; --shadow:0 1px 2px rgba(12,40,48,.06),0 6px 18px rgba(12,40,48,.05);
  --warn:#b4541a; --bad:#b3193f; --ok:#16794e;
  --ui:'Tajawal',Tahoma,Arial,sans-serif; --doc:'Tajawal','Sakkal Majalla',Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121a1d;--surface:#18242a;--surface2:#1e2d33;--ink:#e7ece9;--muted:#a5b4b2;--line:#2d3f45;--soft:#22353b;--accent:#3cc38f;--info:#8ccbd0;--info-bg:#17333a;--info-line:#3a7179;--shadow:0 1px 2px rgba(0,0,0,.35);--warn:#f0a36b;--bad:#f47c97;--ok:#62d9a2;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121a1d;--surface:#18242a;--surface2:#1e2d33;--ink:#e7ece9;--muted:#a5b4b2;--line:#2d3f45;--soft:#22353b;--accent:#3cc38f;--info:#8ccbd0;--info-bg:#17333a;--info-line:#3a7179;--shadow:0 1px 2px rgba(0,0,0,.35);--warn:#f0a36b;--bad:#f47c97;--ok:#62d9a2;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.vh{position:absolute!important;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);pointer-events:none}
label.btn{cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.55}
[hidden]{display:none!important}
.top{background:var(--navy);color:#fff;position:relative}
.top::before{content:"";display:block;height:6px;background:linear-gradient(90deg,#2b7fc3,#3fb36e)}
.topin{max-width:1500px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top h1{font-size:1.25rem;margin:0;font-weight:700;letter-spacing:0}
.top .sub{color:#b9d6d8;font-size:.85rem}
.top .sp1{flex:1}
.savestate{font-size:.8rem;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.1)}
.savestate{cursor:pointer}.savestate.ok::before{content:"● ";color:#5fe0a0}.savestate.bad::before{content:"● ";color:#ff8fa8}
.savestate.local::before{color:#ffd166}.savestate.warn::before{content:"● ";color:#ffb347}.savestate.busy::before{content:"◌ ";color:#9fd8ff}
.wsw{display:inline-flex;margin-inline-end:10px;background:rgba(255,255,255,.08);border-radius:999px;padding:3px;vertical-align:middle}
.wsw button{font:inherit;font-size:.82rem;font-weight:700;border:0;background:transparent;color:#cfe3ea;padding:6px 14px;border-radius:999px;cursor:pointer}
.wsw button.on{background:#fff;color:var(--navy)}
.syncgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:10px 0}
.synccard{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;background:var(--soft)}
.synccard span{font-size:.85rem;color:var(--muted)}
nav#nav{background:var(--navy2);overflow-x:auto;white-space:nowrap;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.navb{background:none;border:0;color:#d4e6e8;font:inherit;font-weight:600;padding:12px 14px;cursor:pointer;border-bottom:3px solid transparent}
.navb:hover{color:#fff}.navb.on{color:#fff;border-bottom-color:#3fd18c}
.navb:focus-visible,.btn:focus-visible,.chip:focus-visible,.fbtn:focus-visible{outline:2px solid #3fd18c;outline-offset:2px}
main#main{max-width:1500px;margin:0 auto;padding-block:18px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
.card h2{margin:0 0 10px;font-size:1.08rem;color:var(--ink)}
.card.empty{text-align:center;color:var(--muted)}
.hint{color:var(--muted);font-size:.86rem;margin:6px 0}
.warnt{color:var(--warn);font-weight:600}.okt{color:var(--ok);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:10px}
.grid label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);font-weight:500;min-width:0}
.grid .wide{grid-column:1/-1}
.in{font:inherit;font-size:.92rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 9px;min-width:0;width:100%}
.in:focus{outline:2px solid color-mix(in srgb,var(--accent) 50%,transparent);border-color:var(--accent)}
td .in{min-width:6rem}
.in.n2{width:3.6rem;min-width:0}.in.n4{width:5.2rem;min-width:0}
.ta{width:100%;font-family:var(--ui);line-height:1.7;resize:vertical}
.acts{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.inl{display:inline-flex;gap:6px;align-items:center;font-size:.86rem;color:var(--muted);white-space:nowrap;max-width:100%}
.inl .in{width:auto;max-width:100%;min-width:0}
select.in{text-overflow:ellipsis}
.ck{display:inline-flex;gap:6px;align-items:center;font-size:.86rem}
.btn{font:inherit;font-weight:600;font-size:.9rem;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{background:transparent;color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 11px;font-size:.84rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.x{border:0;background:none;color:var(--bad);font-size:1.3rem;line-height:1;cursor:pointer;padding:2px 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:.86rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.chip.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface));font-weight:600}
.chip i{width:26px;height:12px;border-radius:6px;display:inline-block}
.row-label{font-weight:600;font-size:.88rem;margin:14px 0 6px}
.tw{overflow-x:auto;max-width:100%;margin-top:8px}
table.et{border-collapse:collapse;width:100%;font-size:.88rem}
table.et th{background:var(--soft);font-weight:600;text-align:right;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;color:var(--ink)}
table.et th[style]{color:#1b2b2f}
table.et td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:middle;font-variant-numeric:tabular-nums}
table.et.sm td{padding:4px 8px}
table.et td.sum{font-weight:700;text-align:center}
table.et tr.tot td{font-weight:700;background:var(--soft);text-align:center;padding:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin:6px 0 10px}
.stat{border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;border-top:5px solid var(--gc,var(--accent))}
.stat span{font-size:.82rem;color:var(--muted)}.stat b{font-size:1.7rem;font-variant-numeric:tabular-nums;line-height:1.2}.stat small{color:var(--muted);font-size:.78rem}
.day .dayhead{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.dname{font-weight:700;font-size:1.1rem;min-width:4.5rem;color:var(--accent)}
.prevdate{font-size:.82rem;color:var(--muted)}
.dayhead .sp1{flex:1}
.brandprev{display:flex;flex-direction:column;gap:8px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;max-width:900px}
.brandprev img{width:100%;height:auto}
.sub{border-top:1px dashed var(--line);padding-top:10px;margin-top:10px}
.upl{margin:10px 0;padding-inline-start:20px}.upl li.ok{color:var(--ok)}.upl li.bad{color:var(--bad)}

/* خانات الرفع */
.drops{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:12px}
.drops.one{grid-template-columns:1fr}
.drop{display:flex;align-items:center;gap:14px;border:2px dashed var(--line);border-radius:12px;padding:16px;background:var(--soft);transition:border-color .15s,background .15s;min-width:0}
.drop.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.drop.done{border-style:solid;border-color:color-mix(in srgb,var(--ok) 55%,transparent);background:color-mix(in srgb,var(--ok) 7%,var(--surface))}
.dic{flex:none;width:50px;height:50px;border-radius:12px;display:grid;place-items:center;background:var(--navy);color:#fff}
.drop.done .dic{background:var(--ok)}
.dtx{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.dtx b{font-size:1rem}.dtx small{color:var(--muted);font-size:.8rem;line-height:1.5}
.dst{font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}.drop.done .dst{color:var(--ok);font-weight:600}.dst i{font-style:normal;color:var(--muted);font-weight:400}
.upnote{padding:10px 14px;border-radius:9px;margin:12px 0 0;font-weight:600;font-size:.9rem}
.upnote.ok{background:color-mix(in srgb,var(--ok) 12%,var(--surface));color:var(--ok)}
.upnote.bad{background:color-mix(in srgb,var(--bad) 10%,var(--surface));color:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:6px}
.seg button{font:inherit;font-size:.86rem;font-weight:600;border:0;background:var(--surface);color:var(--muted);padding:7px 14px;cursor:pointer}
.seg button.on{background:var(--navy);color:#fff}
td.tnames{font-size:.8rem;color:var(--muted);max-width:22rem}
details summary{cursor:pointer;font-weight:600;color:var(--accent);margin:4px 0}
/* شريط خطوات الإعداد */
.flow{display:flex;align-items:center;flex-wrap:wrap;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.fstep{font:inherit;font-size:.82rem;font-weight:600;display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--muted);padding:4px 8px;border-radius:7px;cursor:pointer}
.fstep i{font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;border:1.5px solid var(--line)}
.fstep.ok{color:var(--ok)}.fstep.ok i{background:var(--ok);border-color:var(--ok);color:#fff}
.fstep.todo i{border-style:dashed}
.fstep.cur{background:var(--soft);color:var(--ink)}
.fstep:hover{background:var(--soft)}
.fsep{width:14px;height:1.5px;background:var(--line)}
@media (max-width:600px){.fsep{display:none}.drop{flex-wrap:wrap;align-items:flex-start;padding:14px;gap:12px}.drop .dic{width:46px;height:46px;flex:0 0 46px}.drop .dtx{flex:1 1 calc(100% - 60px);min-width:0}.drop > label.btn{flex:1 1 100%;padding:10px}}

/* الإسناد والملاحظون */
.tagrp{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:12px}
.tagh{display:flex;justify-content:space-between;align-items:center;gap:8px;border-inline-start:6px solid var(--gc);padding:4px 10px;background:var(--soft);border-radius:6px}
.tagh span{font-size:.8rem;color:var(--muted)}
.tagrp .chip{font-size:.78rem;padding:3px 9px}
.obsl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ob{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);padding:1px 2px}
.ob .in{border:0;width:13rem;min-width:8rem;padding:4px 6px}
.ob .in:focus{outline:none}
.ob.dup{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--surface))}
.ob.busy{border-color:#d98a1f;background:color-mix(in srgb,#d98a1f 10%,var(--surface))}
.ob.sw{outline:3px solid var(--accent);outline-offset:1px}
.ic{border:0;background:none;cursor:pointer;font-size:1rem;color:var(--muted);padding:2px 5px;border-radius:5px}
.ic:hover{background:var(--soft);color:var(--ink)}
.ic.x{color:var(--bad);font-size:1.15rem}
.loadl{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.loadl span{font-size:.8rem;border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.gsprev{background:#fff;color:#000;border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:8px;overflow-x:auto;font-family:var(--doc)}
.gsprev table.t{border-collapse:collapse;width:100%;color:#000}
.gsprev table.t td,.gsprev table.t th{border:1px solid #333;padding:3px 5px;text-align:center;font-size:10pt}
.gsprev img{max-width:100%;height:auto}
.gsprev .note,.gsprev .ds{text-align:center;font-size:9.5pt;margin:4px 0}

/* أشرطة الطباعة السريعة */
.qbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--soft);margin:8px 0}
.qlbl{font-weight:700;font-size:.88rem;min-width:9.5rem}
.impd{margin-top:10px}
/* منتقي الشعب */
.secpick{font:inherit;font-size:.9rem;width:100%;min-height:34px;text-align:right;direction:ltr;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);padding:5px 9px;cursor:pointer}
.secpick:hover{border-color:var(--accent)}
.secpop{position:absolute;z-index:70;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:12px;width:min(320px,calc(100vw - 16px))}
.secgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.secb{display:flex;align-items:center;justify-content:center;border:1.5px solid var(--line);border-radius:8px;padding:8px 0;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.secb input{position:absolute;opacity:0;pointer-events:none}
.secb.on{background:var(--accent);border-color:var(--accent);color:#fff}
/* تجهيز PDF */
.pdfstage{position:fixed;left:-20000px;top:0;background:#fff}
.pdfstage .page{box-shadow:none}
.pdfprog{position:fixed;inset:auto 0 0 0;z-index:80;background:var(--navy);color:#fff;padding:12px max(16px,env(safe-area-inset-left,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.pdfprog .tr{height:6px;background:rgba(255,255,255,.2);border-radius:3px;margin-top:6px;overflow:hidden}
.pdfprog .tr i{display:block;height:100%;width:0;background:#3fd18c;transition:width .2s}

/* نافذة المعاينة */
.pvmodal{position:fixed;inset:0;z-index:65;background:#2b3a3f;display:flex;flex-direction:column}
.pvbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--navy);color:#fff;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(10px + env(safe-area-inset-top,0px))}
.pvt{display:flex;flex-direction:column;flex:1;min-width:12rem}.pvt span{font-size:.8rem;color:#b9d6d8}
.pvz,.pva{display:flex;gap:6px;flex-wrap:wrap}
.pvz .chip{background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}.pvz .chip.on{background:#fff;color:var(--navy)}
.pvbar .btn.ghost{color:#fff;border-color:rgba(255,255,255,.35)}

const HFMT = new Intl.DateTimeFormat('en-US-u-ca-islamic-umalqura', { timeZone: 'UTC', day: 'numeric', month: 'numeric', year: 'numeric' });
function isoToDate(iso) { const [y, m, d] = iso.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d, 12)); }
function dateToIso(dt) { return dt.toISOString().slice(0, 10); }
function toHijri(iso) {
  const p = {}; HFMT.formatToParts(isoToDate(iso)).forEach(x => { if (x.type !== 'literal') p[x.type] = parseInt(x.value, 10); });
  return [p.year, p.month, p.day];
}
function hijriToIso(y, m, d) {
  y = +y; m = +m; d = +d; if (!y || !m || !d) return null;
  const jd = d + Math.ceil(29.5 * (m - 1)) + (y - 1) * 354 + Math.floor((3 + 11 * y) / 30) + 1948439.5 - 1;
  const base = new Date(Math.round((jd - 2440587.5) * 86400000) + 12 * 3600000);
  for (let off = 0; off <= 4; off++) for (const sg of [1, -1]) {
    const dt = new Date(base.getTime() + sg * off * 86400000);
    const iso = dateToIso(dt); const h = toHijri(iso);
    if (h[0] === y && h[1] === m && h[2] === d) return iso;
  }
  return null;
}
function fixDay(day) {
  if (!day.g && day.h) day.g = hijriToIso(day.h[0], day.h[1], day.h[2]) || dateToIso(new Date());
  if (!day.g) day.g = dateToIso(new Date());
  day.h = toHijri(day.g);
  if (!day.p) day.p = [];
}
function dayName(day) { return DAYS_AR[isoToDate(day.g).getUTCDay()]; }
function hTxt(day) { const h = toHijri(day.g); return `${h[2]} / ${h[1]} / ${h[0]} هـ`; }
function gTxt(day) { const d = isoToDate(day.g); return `${d.getUTCDate()} / ${d.getUTCMonth() + 1} / ${d.getUTCFullYear()} م`; }
function dateTxt(day, sep = '<br>') {
  if (day.txt && day.txt.trim()) return esc(day.txt);
  const m = S.s.dateMode;
  if (m === 'g') return gTxt(day);
  if (m === 'both') return hTxt(day) + sep + gTxt(day);
  return hTxt(day);
}
function dateShort(day) {
  if (day.txt && day.txt.trim()) return esc(day.txt);
  if (S.s.dateMode === 'g') { const d = isoToDate(day.g); return `${d.getUTCDate()} / ${d.getUTCMonth() + 1} / ${d.getUTCFullYear()}`; }
  const h = toHijri(day.g); return `${h[2]} / ${h[1]} / ${h[0]}`;
}

/* ===================== حسابات مشتركة ===================== */
function sessions() {
  const out = [];
  S.days.forEach((d, di) => d.p.forEach((p, pi) => out.push({ di, pi, day: d, per: p, key: di + '_' + pi })));
  return out;
}
function stuTotals() {
  const t = { 1: 0, 2: 0, 3: 0 };
  S.students.forEach(x => { if (t[x.g] != null) t[x.g]++; });
  return t;
}
function gradeTotals() {
  if (S.students.length) return stuTotals();
  return { 1: +S.s.manualTot[1] || 0, 2: +S.s.manualTot[2] || 0, 3: +S.s.manualTot[3] || 0 };
}
function comTotals() {
  const t = { 1: 0, 2: 0, 3: 0, all: 0 };
  S.com.forEach(c => G.forEach(g => { t[g] += +c.c[g] || 0; t.all += +c.c[g] || 0; }));
  return t;
}
function comSum(c) { return G.reduce((a, g) => a + (+c.c[g] || 0), 0); }
function comPlace(c) { return [c.fl, c.rm && c.rm !== c.fl ? (/^\d+$/.test(c.rm) ? 'ش ' + c.rm : c.rm) : ''].filter(Boolean).join(' – '); }
function teacherOf(sub, g) {
  const r = S.st.find(x => x.sub.trim() === String(sub).trim() && (+x.g === +g || !g));
  return r ? r.t : '';
}
function sessionSubjects(se) { return G.filter(g => (se.per.s[g] || '').trim()).map(g => ({ g, sub: se.per.s[g].trim() })); }
function yearLine() { return `العام الدراسي ${esc(S.s.yearTxt)} – الفصل الدراسي ${esc(S.s.sem)} – الدور ${esc(S.s.round)}`; }
function normName(s) {
  return toWestern(s).replace(/[\u064B-\u0652\u0640]/g, '').replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/ؤ/g, 'و').replace(/ئ/g, 'ي')
    .replace(/عبد\s+/g, 'عبد').replace(/\s+(بن|ابن)\s+/g, ' ').replace(/^(ال)\s+/, '').replace(/\s+/g, ' ').trim();
}
function fmtPhone(p) {
  p = toWestern(p).replace(/\D/g, ''); if (!p) return '';
  let local = p;
  if (p.startsWith('966')) local = '0' + p.slice(3);
  else if (p.length === 9 && p.startsWith('5')) local = '0' + p;
  if (S.s.phoneFmt === '966') return local.startsWith('0') ? '966' + local.slice(1) : p;
  return local;
}
function secLabel(x) { return x.sec; }

function srcList() {

function gname(g) { return GNAME[g] || 'غير محدد الصف'; }
function filteredStudents() {
  let l = srcList().filter(x => (SF.g === 'all' || x.g === +SF.g) && (SF.sec === 'all' || x.sec === +SF.sec));
  if (SF.q.trim()) { const q = normName(SF.q); l = l.filter(x => normName(x.n).includes(q) || String(x.ph).includes(SF.q.trim()) || String(x.id).includes(SF.q.trim())); }

function autoObservers() {
  const ses = sessions(); const load = {}; S.teachers.forEach(t => load[t] = 0);
  if (!S.teachers.length) return false;
  let rot = 0;
  ses.forEach(se => {
    const busy = new Set(sessionSubjects(se).flatMap(x => teachersOfSubject(x.sub, x.g).concat(teacherOf(x.sub, x.g))).filter(Boolean).map(normName)); if (typeof exSet === 'function') exSet(se.key).forEach(n => busy.add(n));
    const used = new Set();
    S.com.forEach(c => {
      const list = [];
      for (let k = 0; k < obsNeed(c.no); k++) {
        const cand = S.teachers.filter(t => !used.has(t) && !busy.has(normName(t)));
        const pool = cand.length ? cand : S.teachers.filter(t => !used.has(t));
        if (!pool.length) break;
        pool.sort((a, b) => load[a] - load[b] || ((S.teachers.indexOf(a) - rot + 999) % S.teachers.length) - ((S.teachers.indexOf(b) - rot + 999) % S.teachers.length));
        const t = pool[0]; used.add(t); load[t]++; list.push(t);
      }
      S.obs[`${se.key}_${c.no}`] = list;
    });
    if (typeof resNeed === 'function') { const rp = S.teachers.filter(t => !used.has(t) && !busy.has(normName(t))).sort((a, b) => load[a] - load[b] || AR.compare(normName(a), normName(b))); S.obs[`${se.key}_R`] = rp.slice(0, resNeed()); }
    rot = (rot + 7) % S.teachers.length;
  });
  return true;
}

async function readDocFile(file) {

  if (isImg) imgs.push(await imgToJpeg(await asUrl(buf, file.type || 'image/jpeg'), 1600));
  else if (buf[0] === 0x25 && buf[1] === 0x50) {
    await ensurePdfJs(); const pdf = await pdfjsLib.getDocument({ data: buf.slice(), isEvalSupported: false }).promise;
    for (let i = 1; i <= Math.min(4, pdf.numPages); i++) {
      const pg = await pdf.getPage(i); const vp0 = pg.getViewport({ scale: 1 }); const vp = pg.getViewport({ scale: 1600 / vp0.width });
      const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height; const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);

      try { txt += ' ' + (await pg.getTextContent()).items.map(t => t.str).join(' '); } catch (e) { }
    }
  } else if (buf[0] === 0xD0 && buf[1] === 0xCF && /\.doc$/i.test(file.name)) {

  } else if (/\.docx$/i.test(file.name) || (buf[0] === 0x50 && /\.do[ct]x?$/i.test(file.name))) {

    const media = z.FullPaths.map((p, i) => ({ p, f: z.FileIndex[i] })).filter(x => /word\/media\/.+\.(png|jpe?g|gif|bmp|webp)$/i.test(x.p) && x.f.content && x.f.content.length > 8000);
    for (const m of media.slice(0, 4)) { const ext = m.p.split('.').pop().toLowerCase(); imgs.push(await imgToJpeg(await asUrl(m.f.content, 'image/' + (ext === 'jpg' ? 'jpeg' : ext)), 1600)); }
    try { txt = docxRows(buf).map(r => r.join(' ')).join('\n'); } catch (e) { }
    if (!imgs.length && txt) html = txt.split('\n').map(l => `<p style="margin:2px 0">${esc(l)}</p>`).join('');
  } else if (/\.(xlsx|xls|csv)$/i.test(file.name)) {

  } else throw new Error('صيغة غير مدعومة — ارفع صورة أو PDF أو Word أو Excel');

}

/* استخراج التواريخ من نص التقويم (هجري أو ميلادي) */

setTimeout(() => { try { const done = localStorage.getItem(LS_KEY + '-semFixV1'); if (done) return; const rm = rawMeta('ta-agent'); if (rm.sem === S.s.sem && !rm.semSet && !inT2()) { updSetMeta('ta-agent', { sem: 'الثاني' }); renderNav(); render(); } localStorage.setItem(LS_KEY + '-semFixV1', '1'); } catch (e) { } }, 1500);

/* ===================== الإسناد: لوحة طباعة موحدة، وألوان المواد، والشعب كشارات ===================== */
const SUBJ_HUES = [210, 145, 28, 340, 270, 48, 185, 0, 95, 235];
function subjColor(sub) { const b = normName(String(sub || '').replace(/[\d\s\-–_/]+$/g, '')).replace(/^ال/, ''); if (!b) return 'var(--line)'; let h = 2166136261; for (const ch of b) h = Math.imul(h ^ ch.charCodeAt(0), 16777619) >>> 0; h = (h ^ (h >>> 13)) >>> 0; return `hsl(${SUBJ_HUES[h % SUBJ_HUES.length]} 58% 46%)`; }

function taPick() { const p = S.s.taPrint = S.s.taPrint || {}; if (!Array.isArray(p.fs)) p.fs = ['taSheet']; return p.fs; }
function taPrintPanel() {

      <button type="button" class="tsel${fs.includes('taLoad') ? ' on' : ''}" data-tact="taF" data-v="taLoad">${fs.includes('taLoad') ? '✓ ' : ''}نصاب المعلمين</button></div>
    ${fs.includes('taSheet') ? `<div class="tapr">${gradeChips(QG.taSheet, 'qG', 'taSheet')}</div>
    <div class="tapr togs">${tg('h', p.h !== false, 'عدد الحصص')}${tg('sign', p.sign !== false, 'التوقيع')}${tg('note', !!p.note, 'ملاحظات')}${tg('split', p.split !== false, 'كل صف في صفحة')}</div>` : ''}
    <div class="tapr"><label class="inl">الكثافة <select class="in" data-k="s.taPrint.dens"><option value="cmp"${(p.dens || 'cmp') === 'cmp' ? ' selected' : ''}>مضغوطة</option><option value="mid"${p.dens === 'mid' ? ' selected' : ''}>متوسطة</option><option value="std"${p.dens === 'std' ? ' selected' : ''}>مريحة للكتابة</option></select></label></div>
    <div class="tapr btns"><button class="btn pri" data-tact="taP" data-v="pv" type="button">معاينة</button><button class="btn" data-tact="taP" data-v="print" type="button">طباعة</button><button class="btn" data-tact="taP" data-v="pdf" type="button">PDF</button><button class="btn" data-tact="taP" data-v="word" type="button">Word</button></div></div>`;
}
function taRun(op) {

  const run = () => { const g = fs.flatMap(f => groupsOf(f, f === 'taSheet' && QG.taSheet && QG.taSheet.length ? { g: QG.taSheet } : {})); return op === 'print' ? printPages(g) : op === 'word' ? wordDoc(g, nm) : op === 'pdf' ? downloadPdf(g, nm) : openPreview(g, nm); };

document.addEventListener('click', e => {
  const b = e.target.closest('[data-tact]'); if (!b) return; const a = b.dataset.tact;
  if (a === 'taF') { const fs = taPick(), v = b.dataset.v, i = fs.indexOf(v); if (i >= 0) fs.splice(i, 1); else fs.push(v); fs.sort((x, y) => (x === 'taSheet' ? 0 : 1) - (y === 'taSheet' ? 0 : 1)); save(); render(); }
  else if (a === 'taP') taRun(b.dataset.v);

/* ===================== التعليمات خلف «؟» ===================== */
function hintsToHelp(root) {
  (root || document).querySelectorAll('.sbody section.card, .sbody .card').forEach(card => {
    const h2 = card.querySelector(':scope > h2'); if (!h2) return;
    const ps = [...card.querySelectorAll(':scope > p.hint')].filter(p => !p.querySelector('button,input,select,a,label') && !(/\d/.test(p.textContent) && p.textContent.length < 90) && !p.classList.contains('keep'));
    if (!ps.length) return; const txt = ps.map(p => p.textContent.trim().replace(/\s+/g, ' ')).join(' ');

if (typeof injectHelp === 'function') { const __ih = injectHelp; injectHelp = function (r) { __ih(r); try { hintsToHelp(r); } catch (e) { } }; }

/* ===================== توزيع الطلاب على لجان الاختبارات (لكل صف) — مرن ===================== */
var DIST_G = 1;
function distComs(g) { return comsOrdered().filter(c => +c.c[g] > 0); }
function distSubs(g) { const out = []; S.days.forEach(d => d.p.forEach(p => { const s = (p.s[g] || '').trim(); if (s && !out.includes(s)) out.push(s); })); return out; }
function distOf(g) {
  S.dist = S.dist || {}; let d = S.dist[g];
  if (!d || !Array.isArray(d.blocks) || !d.blocks.length) { const subs = distSubs(g), n = distComs(g).length, k = Math.max(1, subs.length), base = Math.floor(n / k), rem = n % k;
    d = S.dist[g] = { sec: 'جميع الشعب', blocks: (subs.length ? subs : ['']).map((s, i) => ({ sub: s, t: (typeof teacherOf === 'function' && s ? teacherOf(s, g) : '') || '', n: base + (i >= k - rem ? 1 : 0) })) }; }
  return d;
}
function distSlices(g) { const d = distOf(g), coms = distComs(g); let at = 0; return d.blocks.map((b, i) => { const last = i === d.blocks.length - 1; const n = last ? Math.max(0, coms.length - at) : Math.max(0, Math.min(+b.n || 0, coms.length - at)); const part = coms.slice(at, at + n); at += n; return { b, i, part }; }); }
function distCard() {
  const g = DIST_G, d = distOf(g), coms = distComs(g), sl = distSlices(g), set = d.blocks.slice(0, -1).reduce((a, b) => a + (+b.n || 0), 0);
  const tabs = G.map(x => `<button type="button" class="${x === g ? 'on' : ''}" data-tact="distG" data-v="${x}" style="--gc:${GCOL[x]}">${GSHORT[x]} ثانوي</button>`).join('');
  const rows = sl.map(({ b, i, part }) => { const tot = part.reduce((a, c) => a + (+c.c[g] || 0), 0), last = i === d.blocks.length - 1;
    return `<div class="dsrow" style="--sx:${subjColor(b.sub)}"><div class="dsn">${i + 1}</div>
      <div class="dsf"><label>المادة ${pickSel(`dist.${g}.blocks.${i}.sub`, b.sub, subOpts(g), { kind: 's', ph: '— المادة —', other: 'كتابة مادة أخرى…' })}</label>
      <label>المعلم ${pickSel(`dist.${g}.blocks.${i}.t`, b.t, tchOpts(b.sub ? teachersOfSubject(b.sub, g) : [], 'معلمو المادة'), { ph: '— المعلم —' })}</label></div>
      <div class="dsc">${last ? `<span class="dsall">الباقي</span>` : `<button type="button" class="btn sm" data-tact="distN" data-i="${i}" data-d="-1">−</button><b>${part.length}</b><button type="button" class="btn sm" data-tact="distN" data-i="${i}" data-d="1">+</button>`}<small>${part.length ? `لجان ${part[0].no}–${part[part.length - 1].no} · ${tot} طالباً` : 'لا لجان'}</small></div>
      <button type="button" class="x" data-tact="distDel" data-i="${i}" aria-label="حذف">×</button></div>`; }).join('');
  return `<section class="card distc"><h2>توزيع الطلاب على لجان الاختبارات</h2>
    <div class="semchips gtabs" role="tablist">${tabs}</div>
    <div class="dsmeta"><span><b>${coms.length}</b> لجنة فيها طلاب ${GSHORT[g]} · <b>${coms.reduce((a, c) => a + (+c.c[g] || 0), 0)}</b> طالباً</span><label class="inl">عمود الشعب ${inp(`dist.${g}.sec`, d.sec || '', { ph: 'جميع الشعب' })}</label></div>
    <div class="dsrows">${rows}</div>
    ${set > coms.length ? `<p class="upnote warn">مجموع اللجان المحددة أكبر من عدد لجان الصف — قلّل العدد.</p>` : ''}
    <div class="acts wrap"><button class="btn sm" data-tact="distAdd" type="button">+ مادة / معلم</button><button class="btn sm ghost" data-tact="distEven" type="button">توزيع بالتساوي</button><button class="btn sm ghost" data-tact="distReset" type="button">إعادة من جدول الاختبارات</button></div>
    ${qbar('correct', 'الطباعة:')}</section>`;
}
function distPages(o) {
  const TC = { 1: '#2e8b3a', 2: '#d98a00', 3: '#a85a1a' }, CC = { 1: '#dbe5f1', 2: '#dbe5f1', 3: '#ffffff' };
  return G.filter(g => gOk(o, g) && distComs(g).length).map(g => {
    const d = distOf(g), sl = distSlices(g).filter(x => x.part.length), coms = sl.flatMap(x => x.part), plc = c => bldOf(c);
    const rows = [[H('المادة', { w: '17%' }), H('الشعب', { w: '13%' }), H('رقم اللجنة', { w: '11%' }), H('مقرها', { w: '15%' }), H('عدد الطلاب', { w: '11%' }), H('المعلم')]];
    let total = 0, idx = 0;
    sl.forEach((x, si) => { const alt = si % 2 ? '#f2f2f2' : '#ffffff';
      x.part.forEach((c, i) => { total += +c.c[g] || 0; const r = [];
        if (i === 0) r.push({ v: `<b>${esc(x.b.sub)}</b>`, rs: x.part.length, bg: alt });
        if (idx === 0) r.push({ v: `<b>${esc(d.sec || 'جميع الشعب')}</b>`, rs: coms.length, bg: '#ffffff' });
        r.push({ v: `<b>${c.no}</b>`, bg: CC[g] });
        const p = plc(c), prev = idx > 0 ? plc(coms[idx - 1]) : null; if (p !== prev) { let k = idx; while (k < coms.length && plc(coms[k]) === p) k++; r.push({ v: `<b>${esc(p)}</b>`, rs: k - idx, bg: '#f2f2f2' }); }
        r.push({ v: `<b>${+c.c[g] || 0}</b>`, bg: GCOL[g] });
        if (i === 0) r.push({ v: `<b>${esc(x.b.t || '')}</b>`, rs: x.part.length, bg: alt });
        rows.push(r); idx++; }); });
    rows.push([{ v: '<b>عدد الطلاب</b>', cs: 5, bg: '#e7e6e6' }, { v: `<b>${total}</b>`, bg: GCOL[g] }]);
    return `<p class="dt" style="color:${TC[g]}">توزيع طلاب ${GSHORT[g]} ثانوي على لجان الاختبارات</p>` + T(rows, { cls: 'dense nogrow' });
  });
}
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-tact]'); if (!b) return; const a = b.dataset.tact, g = DIST_G;
  if (a === 'distG') { DIST_G = +b.dataset.v; render(); return; }
  if (!a.startsWith('dist')) return; const d = distOf(g);
  if (a === 'distN') { const bl = d.blocks[+b.dataset.i]; bl.n = Math.max(0, (+bl.n || 0) + +b.dataset.d); }
  else if (a === 'distDel') { if (d.blocks.length < 2) return toast('يلزم سطر واحد على الأقل', true); d.blocks.splice(+b.dataset.i, 1); }
  else if (a === 'distAdd') { const n = distComs(g).length, k = d.blocks.length + 1; d.blocks.push({ sub: '', t: '', n: 0 }); const base = Math.floor(n / k); d.blocks.forEach((x, i) => x.n = base + (i >= k - n % k ? 1 : 0)); }
  else if (a === 'distEven') { const n = distComs(g).length, k = d.blocks.length; d.blocks.forEach((x, i) => x.n = Math.floor(n / k) + (i >= k - n % k ? 1 : 0)); }
  else if (a === 'distReset') { if (!await confirmBox(`إعادة بناء توزيع ${GNAME[g]} من جدول الاختبارات والإسناد؟`)) return; delete S.dist[g]; distOf(g); }
  save(); render();
});

/* ===================== تنبيه نسخة جديدة من الموقع ===================== */
var BUILD_ID = '1794515840';
/* التحديث التلقائي: يُطبَّق الإصدار الجديد وحده متى كان آمناً (لا كتابة جارية ولا نافذة مفتوحة) */
var VER_RELOADING = false;
function verSafe() { if (VER_RELOADING) return false; const a = document.activeElement, typing = a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== 'button';
  const modal = (typeof WSHEET !== 'undefined' && WSHEET) || !($('#pvModal') || {}).hidden || document.querySelector('#pickModal:not([hidden]), .modal:not([hidden]), .palmodal:not([hidden]), dialog[open]');
  return document.visibilityState === 'hidden' || (!typing && !modal); }
async function checkVersion() {
  try { const r = await fetch('version.txt?t=' + Date.now(), { cache: 'no-store' }); if (!r.ok) return; const v = (await r.text()).trim(); if (!v || v === BUILD_ID || BUILD_ID.startsWith('__')) return;
    if (verSafe()) { try { save(true); } catch (e) { } VER_RELOADING = true; setTimeout(() => location.reload(), 600); return; }
    if ($('#newVer')) return; const d = document.createElement('div'); d.id = 'newVer'; d.className = 'newver'; d.innerHTML = '<span>✨ تحديث جديد للموقع متاح</span><button class="btn sm pri" type="button">تحديث الآن</button>'; d.querySelector('button').onclick = () => location.reload(); document.body.appendChild(d);
  } catch (e) { }
}

setInterval(() => { if (document.visibilityState === 'visible') checkVersion(); }, 120000);
setTimeout(checkVersion, 4000);

/* المقر العام للجنة (المبنى / الصالة الرياضية) — مستقل عن الدور والقاعة */
function gymFrom() { const v = S.s.gymFrom; return v === '' || v === 0 || v === '0' ? 0 : (+v || 25); }
function bldOf(c) { if (c.bld) return c.bld; if (OUTSIDE.test((c.fl || '') + ' ' + (c.rm || ''))) return (c.fl || c.rm || '').trim(); const k = gymFrom(); return k && +c.no >= k ? 'الصالة الرياضية' : 'المبنى'; }
function bldCtl() { return `<div class="comcnt"><span>المقر:</span><b style="font-size:.95rem">المبنى</b><span>من اللجنة 1 — و</span><b style="font-size:.95rem">الصالة الرياضية</b><span>من اللجنة</span><input class="in" type="number" min="0" data-k="s.gymFrom" data-num="1" value="${gymFrom()}" style="width:4.5rem"><small class="hint">يظهر في كشوف الملاحظين وتوزيع الطلاب ولوحة الاختبار. اكتب 0 إن لم تُستخدم الصالة.</small></div>`; }
